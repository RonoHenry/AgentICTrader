[pytest]
# Root test suite. Run from the repo root: `pytest`.
# backend/tests/ is a separate suite with its own config (backend/pytest.ini,
# Django settings); it cannot share a process with this one. To run every
# suite with a single exit code use:  python scripts/run_all_tests.py
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery paths
testpaths =
    tests
    ml
    agent
    services
    nlp
    scripts/rag/tests

# Tests that need live services (Docker, Qdrant, InfluxDB, MLflow server, a
# broker feed) are marked `infrastructure` and deselected by default. Opt back
# in with `-m ""` (everything) or your own `-m EXPR`; a later -m on the
# command line overrides this one.
addopts = -v --tb=short -ra -m "not infrastructure"

# Markers
markers =
    unit: Unit tests — no external dependencies
    integration: Integration tests — several components together; if one also needs a live service, mark it infrastructure too
    contract: Contract tests — verify inter-service schemas
    property: Property-based tests using hypothesis
    infrastructure: Tests requiring external infrastructure (deselected by default)
    performance: Latency / throughput benchmarks (timing-sensitive)
    slow: Tests that take longer to run

# Async support
asyncio_mode = auto

# Ignore dirs
norecursedirs =
    .git
    .venv
    venv
    __pycache__
    *.egg-info
    node_modules
    .tox
    build
    dist
