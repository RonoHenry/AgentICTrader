<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noculus · Engine</title>
<link rel="stylesheet" href="/static/app.css">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  .layers label { margin-right: 10px; white-space: nowrap; }
  .log { max-height: 260px; overflow-y: auto; font-size: 12px; }
  .log div { padding: 2px 4px; border-radius: 4px; cursor: pointer; }
  .log div:hover { background: var(--chip); }
  .log .now { background: var(--chip); }
  .cond { font-size: 12px; } .cond .y { color: var(--good); } .cond .n { color: var(--bad); }
  .progress { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin: 6px 0; }
  .progress > div { height: 100%; background: var(--accent); width: 0; }
  .decision { font-weight: 650; }
  .cand { position: relative; padding: 4px 64px 4px 6px; margin: 3px 0; border: 1px solid transparent; border-radius: 6px; cursor: default; }
  .cand:hover { background: var(--chip); }
  .cand.chosen { border-color: var(--accent); }
  .cand.mine { background: var(--chip); border-color: var(--good); }
  .cand .rk { font-weight: 700; }
  .cand button.pick { position: absolute; right: 4px; top: 4px; font-size: 11px; padding: 1px 7px; }
  .cands textarea { min-height: 44px; margin-top: 6px; }
  .nmark { display: flex; align-items: baseline; gap: 6px; padding: 2px 0; font-size: 12px; }
  .nmark button { margin-left: auto; font-size: 11px; padding: 0 6px; }
  .ntools button.on { border-color: var(--good); }
  .ma { padding: 4px 0; border-top: 1px solid var(--line); }
  .ma:first-of-type { border-top: 0; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4; pointer-events: none; }
  #overlay > div { pointer-events: auto; max-width: 440px; padding: 18px 22px; border-radius: 10px; background: var(--panel);
                   border: 1px solid var(--line); box-shadow: var(--shadow); text-align: center; }
  #overlay .big { font-size: 15px; font-weight: 650; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="shell"></div>
<header>
  <h1>Noculus · Engine · <span id="inst">—</span></h1>
  <span class="pill" id="status">no session</span>
  <span class="when" id="when"></span>
  <span class="muted" id="price"></span>
  <span class="spacer"></span>
  <span class="muted" id="summaryTop"></span>
</header>
<div id="bar">
  <div class="group" id="tfs"></div>
  <span class="sep"></span>
  <div class="group">
    <button class="boxed" id="play" title="Play / pause (Space)">▶ Play</button>
    <select id="speed" title="Speed"></select>
    <button class="boxed" id="stepBtn" title="To the next 15-minute close (→)">Step ▸</button>
    <button class="boxed" id="nextSetup" title="To the next order the engine places">Next order ⏭</button>
    <button class="boxed" id="nextEvent" title="To the next order, fill or exit">Next event ⏭</button>
  </div>
  <span class="sep"></span>
  <div class="group layers" id="layers"></div>
</div>
<main>
  <nav id="tools"></nav>
  <section id="chartWrap"><div id="chart"></div><div id="overlay"><div><div class="big" id="ovTitle">No session yet</div>
    <div class="muted" id="ovText">Pick an instrument and days on the right, then Start session.</div>
    <div class="progress"><div id="ovProg"></div></div></div></div></section>
  <aside>
    <div id="watchlist"></div>
    <h2>Session</h2>
    <div class="row"><label>Instrument</label><select id="sInst"></select></div>
    <div class="row"><label>First day</label><input type="date" id="sDay"></div>
    <div class="row"><label>Days</label><select id="sDays"></select></div>
    <div class="row"><label>Strategy</label><select id="sVariant"></select></div>
    <div class="row"><label title="Noculus: the engine stays hidden until you reveal it">
      <input type="checkbox" id="sBlind"> Blind (mark it yourself first)</label></div>
    <div class="row"><button class="primary" id="sStart">Start session</button></div>
    <div class="hint bad" id="blindWarn"></div>
    <div class="progress"><div id="prog"></div></div>
    <div class="hint" id="sMsg">Days come from the exploration slice. The backtest runs over them exactly as a real run, then plays here.</div>
    <div id="noculus"></div>
    <div id="fractal"></div>
    <div id="engine"></div>
    <h2>Events</h2>
    <div class="log" id="log"></div>
    <div id="msg"></div>
  </aside>
</main>
<script src="/static/drawings.js"></script>
<script src="/static/settings.js"></script>
<script src="/static/motion.js"></script>
<script src="/static/noculus.js"></script>
<script src="/static/fractal.js"></script>
<script src="/static/shell.js"></script>
<script src="/static/engine.js"></script>
</body>
</html>
