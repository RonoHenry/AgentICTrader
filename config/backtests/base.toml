# AlgoBacktester base run configuration (.kiro/specs/algo-backtester, task 197).
#   python -m algo_backtester run config/backtests/base.toml [--variant NAME]
# A variant is a named set of dotted-key overrides on top of this file.
# Unknown keys are rejected, so a typo fails instead of running the default.

[run]
profile = "exness-standard"                              # D11: venue, specs, costs, symbols
instruments = ["EURUSD", "GBPUSD", "USDJPY", "XAUUSD"]   # D1
start = 2025-01-01                                       # [start, end), UTC
end = 2026-07-01
study = "baseline-2026q3"                                # hold-out: config/backtests/studies/<study>.toml

[account]
initial_equity = 10000.0
risk_per_trade = 0.01
compounding = false

[strategy]            # → agent.strategy_config.StrategyConfig, the live settings
entry_tf = "M15"
min_rr = 3.0
pending_expiry = "KILLZONE_END"
fallback_ttl_minutes = 180

[data]
max_gap_minutes = 30          # outside weekends/holidays (Req 3.6)
# Exness 2025-01 → 2026-06 (task 211): gold's US-holiday closes, the 2025-11-28 CME
# outage and two sub-hour feed gaps. Real closures, recorded in the manifest.
allow_gaps = true

[report]
min_trades = 30               # D8
cost_flag_fraction = 0.25     # Req 5.5
bootstrap_resamples = 10000

[variants.min_rr_5]
strategy.min_rr = 5.0

[variants.stop_body]           # stop behind the protected swing's body, not its wick (liquidity-engine LE-D5)
strategy.stop_mode = "BODY"

# Candle anticipation (liquidity-engine update 2026-10b, task 242): trade the setup
# only on the anticipated candle's false-move side, raided in the 01:00-13:00
# New York window, toward the nearer of SD 2.0 and the profile's draw, with a
# stop of at least two typical spreads.
[variants.anticipation]
strategy.bias_mode = "PROFILE"
strategy.require_false_move = true
strategy.time_window = "MANIPULATION"
strategy.target_mode = "NEAREST"
strategy.min_stop_spreads = 2.0

[variants.anticipation_body]   # the same, with the stop behind the protected swing's body
strategy.bias_mode = "PROFILE"
strategy.require_false_move = true
strategy.time_window = "MANIPULATION"
strategy.target_mode = "NEAREST"
strategy.min_stop_spreads = 2.0
strategy.stop_mode = "BODY"

[variants.anticipation_poi]    # the same, with the protected swing inside an H4/D1 PD array (LE-D14)
strategy.bias_mode = "PROFILE"
strategy.require_false_move = true
strategy.time_window = "MANIPULATION"
strategy.target_mode = "NEAREST"
strategy.min_stop_spreads = 2.0
strategy.require_htf_poi = true
