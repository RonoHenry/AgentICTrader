# The pre-registered confirmation runs, on the period after the exploration slice and before the hold-out:
# - docs/backtests/CONFIRMATION_TRADER_EXECUTION.md (2026-10-22): m5_fresh_near_gap, on hold, not run;
# - docs/backtests/CONFIRMATION_D1_BOX.md (2026-10-23): fresh_near_gap_box, judged; fresh_near_gap, reported.
#   python -m algo_backtester run config/backtests/confirm.toml --snapshot focus-2025-2026h1 \
#       --variant fresh_near_gap --variant fresh_near_gap_box --workers 4
# Everything but the period is focus.toml's. Nothing here changes after the commit that pre-registers it.

[run]
profile = "exness-standard"
instruments = ["XAUUSD", "EURUSD", "GBPUSD", "US100", "US500", "US30"]
start = 2025-07-01                                       # [start, end), UTC: after the exploration slice
end = 2026-07-01                                         # the study's hold-out starts 2026-07-07
study = "baseline-2026q3"

[account]
initial_equity = 10000.0
risk_per_trade = 0.01
compounding = false

[strategy]
entry_tf = "M15"
min_rr = 3.0
pending_expiry = "KILLZONE_END"
fallback_ttl_minutes = 180

[data]
max_gap_minutes = 30
allow_gaps = true

[report]
min_trades = 30
cost_flag_fraction = 0.25
bootstrap_resamples = 10000

# The version under test: entries on M5; the raid in the current or previous H1 candle; the stop at most one
# closed-M15 average range from the entry; TP1 the nearer of SD 2.0 and the day's draw; the FVG as the gap, read
# from closed candles (liquidity-engine Req 26.6, 27).
[variants.m5_fresh_near_gap]
strategy.entry_tf = "M5"
strategy.fvg_zone = "gap"
strategy.raid_window = "H1"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"

# The trader's execution on M15 (liquidity-engine Req 26.6, 27): the reference for the box, reported, not judged.
[variants.fresh_near_gap]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"

# The version under test (CONFIRMATION_D1_BOX.md): fresh_near_gap, standing aside while every D1 close since the
# last D1 candle of at least 1.2 times the 20-day mean range is inside that candle's range (Req 29).
[variants.fresh_near_gap_box]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"
strategy.d1_box_expansion = 1.2
