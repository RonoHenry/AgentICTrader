# The trader's focus markets (2026-10-16) that the Exness profile prices in USD: the engine fixes against the
# reference (liquidity-engine update 2026-10-21, task 344). DXY is the trader's reference index and BTC has no
# Exness spec. GER40 (EUR) and UK100 (GBP) wait for the backtester's currency conversion (run.py refuses crosses).
#   python -m algo_backtester run config/backtests/focus.toml --snapshot focus-2025-2026h1 \
#       --variant base --variant fresh --variant fresh_near --variant gap --variant fresh_gap --variant fresh_near_gap
# Candles come from the research snapshot, the M1 the research and Noculus read. The period is the research's
# exploration slice: the rest, to the hold-out, stays for one pre-registered confirmation of what comes out of it.

[run]
profile = "exness-standard"
instruments = ["XAUUSD", "EURUSD", "GBPUSD", "US100", "US500", "US30"]
start = 2025-01-01                                       # [start, end), UTC: the exploration slice
end = 2025-07-01
study = "baseline-2026q3"                                # hold-out: config/backtests/studies/<study>.toml

[account]
initial_equity = 10000.0
risk_per_trade = 0.01
compounding = false

[strategy]
entry_tf = "M15"
min_rr = 3.0
pending_expiry = "KILLZONE_END"
fallback_ttl_minutes = 180

[data]
max_gap_minutes = 30
allow_gaps = true             # the markets' own closures (holidays, the indices' daily break), as base.toml

[report]
min_trades = 30
cost_flag_fraction = 0.25
bootstrap_resamples = 10000

# The FVG as the trader reads it: the gap, read from closed candles (Req 26, LE-D17, LE-D20).
[variants.gap]
strategy.fvg_zone = "gap"

# A fresh raid: in the current or previous H4 candle (Req 27, LE-D19).
[variants.fresh]
strategy.raid_window = "H4"

# The trader's execution: a fresh raid, the stop at its tip (one M15 range at most), TP1 the nearer of SD 2.0
# and the day's draw (Req 27.5-27.6, LE-D21).
[variants.fresh_near]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"

[variants.fresh_gap]
strategy.raid_window = "H4"
strategy.fvg_zone = "gap"

[variants.fresh_near_gap]       # the full fix, on M15
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"

# The full fix, managed as the trader chose on 2026-10-27 (algo-backtester Req 28): a third off at 3R, the rest
# moved to break-even at that moment. An exit rule judged on forward data, not an edge.
[variants.fresh_near_gap_partial]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"
management.partial_r = 3.0
management.partial_fraction = 0.3333333333333333

# The full fix, standing aside while price is still inside the last expansion day's range (Req 29, LE-D25/D26):
# GBPUSD 27-29 January 2025, the engine trading the middle of that box with expansion targets.
[variants.fresh_near_gap_box]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"
strategy.d1_box_expansion = 1.2

# The CISD the trader's indicator draws (Req 30, LE-D28/D29): anchored on the run into the sweep's extreme ("run"),
# and the same after a C2 sweep of the CRT frame's previous candle only ("crt"; H4 for M15 entries).
[variants.run]
strategy.cisd = "run"

[variants.crt]
strategy.cisd = "crt"

[variants.fresh_near_gap_run]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"
strategy.cisd = "run"

[variants.fresh_near_gap_crt]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"
strategy.cisd = "crt"

# The trader's order blocks (Req 31, LE-D31-D33): the run closed through its first open, read from its bodies, the
# entry at their mean threshold; a close beyond the bodies inverts it into a breaker. Unmanaged and managed.
[variants.fresh_near_gap_ob]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"
strategy.ob_rule = "cisd"

[variants.fresh_near_gap_partial_ob]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"
strategy.ob_rule = "cisd"
management.partial_r = 3.0
management.partial_fraction = 0.3333333333333333

# On M5, where the trader executes (M1-M5): the sequence from sweep to entry forms there inside one M15 candle.
# The fresh raid is then read on H1, the trader's indicator's frame for M5; the stop cap stays in M15 ranges.
[variants.m5_gap]
strategy.entry_tf = "M5"
strategy.fvg_zone = "gap"

[variants.m5_fresh_near_gap]    # the full fix, on M5
strategy.entry_tf = "M5"
strategy.fvg_zone = "gap"
strategy.raid_window = "H1"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"

# The trader's execution, trading only the day's thesis side (market-narrative Requirement 17). The thesis file is
# written by `python -m algo_research.thesis export --model <id> --out data/research/theses/engine_theses.json`.
[variants.fresh_near_gap_thesis]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"
strategy.bias_mode = "THESIS"
strategy.thesis_file = "data/research/theses/engine_theses.json"

# The trader's weekly context (context-engine Requirement 32.5): the partial strategy trading only the side of the
# trader's call for the week (Noculus /context), until its draw trades or a D1 candle closes beyond its protected
# swing, with stops of at least ten typical spreads. The calls write the thesis file.
[variants.fresh_near_gap_context]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"
strategy.bias_mode = "THESIS"
strategy.thesis_file = "data/research/theses/context_theses.json"
strategy.min_stop_spreads = 10.0
management.partial_r = 3.0
management.partial_fraction = 0.3333333333333333

# Where the engine waits (context-engine Requirement 34): the partial strategy, its setups kept only when the raid
# was in Q2-Q3 (00:00-12:00 New York) and the protected wick sits inside a level of its side (an H4, D1 or W1 array in
# discount, or premium, of the D1 or W1 range). The trader's blueprint of 2026-10-31: the level first, then the trigger.
[variants.fresh_near_gap_levels]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"
strategy.require_level = true
management.partial_r = 3.0
management.partial_fraction = 0.3333333333333333

# Algo Mind's hands (algo-mind Requirement 5): the context variant trading the brain's weekly side (its brief's
# calls, no draw: the side holds for the week), and the side where the trader and the brain agree (the trader's draw
# and protected swing). Briefs and calls write the thesis files.
[variants.fresh_near_gap_brain]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"
strategy.bias_mode = "THESIS"
strategy.thesis_file = "data/research/theses/brain_theses.json"
strategy.min_stop_spreads = 10.0
management.partial_r = 3.0
management.partial_fraction = 0.3333333333333333

[variants.fresh_near_gap_agree]
strategy.raid_window = "H4"
strategy.max_stop_atr = 1.0
strategy.target_mode = "NEAREST"
strategy.fvg_zone = "gap"
strategy.bias_mode = "THESIS"
strategy.thesis_file = "data/research/theses/agree_theses.json"
strategy.min_stop_spreads = 10.0
management.partial_r = 3.0
management.partial_fraction = 0.3333333333333333
