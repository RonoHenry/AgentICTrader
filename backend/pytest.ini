[pytest]
DJANGO_SETTINGS_MODULE = agentictrader.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# infrastructure: needs live services. legacy: quarantined drift, see
# _LEGACY_TESTS in tests/conftest.py. Override with -m "" or your own -m.
addopts = -v -ra -q -m "not infrastructure and not legacy"

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    infrastructure: Tests that require external services
    legacy: Quarantined - test and code drifted apart in code the live path does not use (reason in tests/conftest.py)
    e2e: End-to-end tests
    slow: Tests that take longer to run

# Configure test discovery
norecursedirs = .git .tox venv* agentic.venv requirements

# Enable async tests
asyncio_mode = auto
